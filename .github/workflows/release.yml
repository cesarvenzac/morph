# Publishes to npm when a version's tag arrives (v0.1.1, whose package.json must say 0.1.1),
# through npm's trusted publishing: npm trusts this workflow in this repository, so there's no
# token anywhere, and every release says where and how it was built (provenance). The first
# version was published by hand, as npm requires, so a tag whose version is already on npm is
# checked and left as it is.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later, whatever Node bundles.
      - run: npm install --global npm@11
      - name: The tag names the package's version
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(node -p "require('./package.json').name")
          stated=$(node -p "require('./package.json').version")
          [ "$stated" = "$version" ] || { echo "::error::package.json says $stated, the tag $version"; exit 1; }
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name@$version is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - if: steps.release.outputs.published != 'true'
        run: npm publish --provenance
