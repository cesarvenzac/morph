name: Feature request
description: Suggest an improvement or a new capability.
labels: ['type:feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the API or behavior to look like? Code sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
