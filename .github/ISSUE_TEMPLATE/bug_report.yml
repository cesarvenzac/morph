name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If a morph *looks* wrong but nothing crashes, use the **Bad morph** template instead.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@morphfx/core'
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Framework and versions (React, Next.js, Expo/React Native, Reanimated…), browser or device, OS.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or a link (StackBlitz, CodeSandbox, Expo Snack, repository) that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
