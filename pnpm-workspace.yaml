packages:
  - packages/*
  - apps/*

# Shared dependency versions. Reference them with "catalog:" in package.json.
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@size-limit/preset-small-lib': ^14.2.0
  '@testing-library/react': ^16.3.3
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  fast-check: ^4.10.2
  jsdom: ^30.1.2
  next: ^16.4.0
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  size-limit: ^14.2.0
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vite: ^8.3.4
  vitest: ^5.0.3

# Versions bundled with Expo SDK 57 (React Native needs the exact React version
# its renderer was built with). Reference them with "catalog:expo".
catalogs:
  expo:
    '@expo/metro-runtime': ~57.0.16
    '@react-native/metro-config': 0.86.3
    '@shopify/react-native-skia': 2.6.2
    expo: ~57.0.27
    expo-status-bar: ~57.0.1
    react: 19.2.3
    react-dom: 19.2.3
    react-native: 0.86.3
    react-native-reanimated: 4.5.1
    react-native-svg: 15.15.4
    react-native-web: ~0.21.0
    react-native-worklets: 0.10.1

# Install scripts allowed to run. Skia's downloads native binaries, which only
# apps building for iOS or Android with Skia need (the examples don't).
allowBuilds:
  '@shopify/react-native-skia': false
